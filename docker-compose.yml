services:
  # Service Base de données MySQL
  database:
    image: mysql:8.0
    container_name: supfile_database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - supfile_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Service API Symfony
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supfile_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - storage_data:/var/www/html/storage
      - ./docs:/var/www/docs
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}?serverVersion=8.0"
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET}
      DEFAULT_URI: ${DEFAULT_URI:-}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - supfile_network

  # Service Frontend Web React
  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: supfile_web
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - api
    networks:
      - supfile_network

  # Service Frontend Mobile Expo
  mobile:
    build:
      context: ./frontend-mobile
      dockerfile: Dockerfile
    container_name: supfile_mobile
    ports:
      - "8082:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend-mobile:/app
      - /app/node_modules
    environment:
      EXPO_PUBLIC_API_URL: http://192.168.0.15:8000/api
    depends_on:
      - api
    networks:
      - supfile_network

volumes:
  mysql_data:
    driver: local
  storage_data:
    driver: local

networks:
  supfile_network:
    driver: bridge