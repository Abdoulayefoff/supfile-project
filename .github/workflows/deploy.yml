# Pipeline CI/CD — SUPFile → Azure
# Déclenché sur push/PR vers main uniquement.
#
# Jobs :
#   1. test-backend    → PHPUnit (tests Symfony)
#   2. test-frontend   → Jest (tests React)
#   3. security        → composer audit + npm audit + Trivy
#   4. build           → Build frontend (vérification)
#   5. deploy-backend  → Build image Docker + push ACR + update App Service
#   6. deploy-frontend → Azure Static Web Apps

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions minimales par défaut (principe du moindre privilège).
permissions:
  contents: read

env:
  # À remplacer par le nom réel de l'ACR
  ACR_LOGIN_SERVER: supfileregistry.azurecr.io
  BACKEND_IMAGE: supfileregistry.azurecr.io/supfile-backend

jobs:

  # JOB 1 — Tests backend (PHPUnit)
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0.45
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: supfile_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none
          ini-values: upload_max_filesize=128M, post_max_size=128M

      - name: Create .env for CI
        run: |
          cat > .env << EOF
          APP_ENV=test
          APP_SECRET=${CI_APP_SECRET}
          DATABASE_URL="mysql://root:${CI_MYSQL_ROOT_PASSWORD}@127.0.0.1:3306/supfile_test?serverVersion=8.0"
          JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
          JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
          JWT_PASSPHRASE=${CI_JWT_PASSPHRASE}
          STORAGE_DRIVER=local
          AZURE_STORAGE_CONNECTION_STRING=
          AZURE_STORAGE_CONTAINER=files
          CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
          DEFAULT_URI=http://localhost:8000
          MAILER_DSN=null://null
          MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0
          OAUTH_GOOGLE_CLIENT_ID=ci-placeholder
          OAUTH_GOOGLE_CLIENT_SECRET=ci-placeholder
          OAUTH_GITHUB_CLIENT_ID=ci-placeholder
          OAUTH_GITHUB_CLIENT_SECRET=ci-placeholder
          OAUTH_MICROSOFT_CLIENT_ID=ci-placeholder
          OAUTH_MICROSOFT_CLIENT_SECRET=ci-placeholder
          EOF
        working-directory: ./backend
        env:
          CI_APP_SECRET: ${{ secrets.APP_SECRET }}
          CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          CI_JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
        working-directory: ./backend

      - name: Generate JWT Keys (Test)
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test
        working-directory: ./backend
        env:
          DATABASE_URL: "mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/supfile_test?serverVersion=8.0"
          JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

      - name: Warm up cache (Test)
        run: php bin/console cache:warmup --env=test
        working-directory: ./backend
        env:
          DATABASE_URL: "mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/supfile_test?serverVersion=8.0"
          JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

      - name: Setup Database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
        working-directory: ./backend
        env:
          DATABASE_URL: "mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/supfile_test?serverVersion=8.0"
          JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

      - name: Run backend tests
        run: php bin/phpunit --fail-on-empty-test-suite
        working-directory: ./backend
        env:
          DATABASE_URL: "mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/supfile_test?serverVersion=8.0"
          JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}

  # JOB 2 — Tests frontend (Jest)
  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend-web dependencies
        run: npm install
        working-directory: ./frontend-web

      - name: Run frontend-web tests
        run: npx jest --ci
        working-directory: ./frontend-web

  # JOB 3 — Audit de sécurité (composer + npm + Trivy)
  security:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Audit backend dependencies
        run: composer audit
        working-directory: ./backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./frontend-web

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: ./frontend-web

      - name: Scan Trivy dependances PHP (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

      - name: Scan Trivy dependances JS (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: frontend-web/
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

  # JOB 4 — Build frontend (vérification)
  build:
    runs-on: ubuntu-latest
    needs: [security]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./frontend-web

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend-web

  # JOB 5 — Deploy Backend (push sur main uniquement = merge PR)
  deploy-backend:
    name: Deploy Backend -> Azure App Service
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image Docker (backend production)
        working-directory: ./backend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile.prod \
            -t "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            -t "${BACKEND_IMAGE}:latest" \
            .

      - name: Scan image Docker (CRITICAL - bloquant)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          format: table

      - name: Push image vers ACR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"

      - name: Deployer sur Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.BACKEND_APP_NAME }}
          images: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Logout Azure
        if: always()
        run: az logout

  # JOB 6 — Deploy Frontend (push sur main uniquement = merge PR)
  deploy-frontend:
    name: Deploy Frontend -> Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend-web
          output_location: dist
          app_build_command: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
