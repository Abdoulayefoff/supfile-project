security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Provider qui charge les utilisateurs depuis la base de données
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall pour l'authentification (login, register)
        login:
            pattern: ^/api/auth
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Firewall pour la documentation PDF (accès public)
        docs:
            pattern: ^/docs
            security: false

        # Firewall pour les routes publiques (partage public, légal, etc.)
        public:
            pattern: ^/api/(public|shares/public|legal)
            stateless: true
            security: false

        # Firewall principal pour l'API protégée par JWT
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    # Easy way to control access for large sections of your site
    # Note: Only the *first* matching rule is applied
    access_control:
        # Routes publiques (pas d'authentification requise)
        - { path: ^/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oauth, roles: PUBLIC_ACCESS }  # Routes OAuth (Google, GitHub, Microsoft)
        - { path: ^/api/auth/forgot-password, roles: PUBLIC_ACCESS }  # ← Reset mot de passe étape 1
        - { path: ^/api/auth/reset-password, roles: PUBLIC_ACCESS }   # ← Reset mot de passe étape 2
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/shares/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/legal, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        # Toutes les autres routes API nécessitent une authentification
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon