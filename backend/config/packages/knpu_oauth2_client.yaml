knpu_oauth2_client:
    clients:
        # Google OAuth Configuration
        google:
            type: google
            client_id: '%env(OAUTH_GOOGLE_CLIENT_ID)%'
            client_secret: '%env(OAUTH_GOOGLE_CLIENT_SECRET)%'
            redirect_route: api_oauth_google_check
            redirect_params: {}
            use_state: true
        
        # GitHub OAuth Configuration
        github:
            type: github
            client_id: '%env(OAUTH_GITHUB_CLIENT_ID)%'
            client_secret: '%env(OAUTH_GITHUB_CLIENT_SECRET)%'
            redirect_route: api_oauth_github_check
            redirect_params: {}
            use_state: true
        
        # Microsoft OAuth Configuration
        microsoft:
            type: microsoft
            client_id: '%env(OAUTH_MICROSOFT_CLIENT_ID)%'
            client_secret: '%env(OAUTH_MICROSOFT_CLIENT_SECRET)%'
            redirect_route: api_oauth_microsoft_check
            redirect_params: {}
            use_state: true
            # 'tenant' n'est pas une option valide dans knpu → on passe les URLs explicitement.
            # /common/ = accepte comptes perso ET pro/école Microsoft.
            url_authorize: 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize'
            url_access_token: 'https://login.microsoftonline.com/common/oauth2/v2.0/token'
            url_resource_owner_details: 'https://graph.microsoft.com/v1.0/me'