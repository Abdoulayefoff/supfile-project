# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    locale: 'en'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # ── Stockage local (développement)
    App\Service\Storage\LocalFileStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ── Stockage Azure Blob (production)
    App\Service\Storage\AzureBlobStorage:
        arguments:
            $connectionString: '%env(AZURE_STORAGE_CONNECTION_STRING)%'
            $container:        '%env(AZURE_STORAGE_CONTAINER)%'

    # ── Factory : choisit l'implémentation selon STORAGE_DRIVER
    # STORAGE_DRIVER=local en dev, STORAGE_DRIVER=azure en prod (Azure App Service)
    App\Service\Storage\StorageFactory:
        arguments:
            $storageDriver: '%env(STORAGE_DRIVER)%'

    # ── L'interface est résolue via la factory
    App\Service\Storage\FileStorageInterface:
        factory: ['@App\Service\Storage\StorageFactory', 'create']

    # ── OAuthController : URL de redirection frontend selon l'environnement
    App\Controller\Api\OAuthController:
        arguments:
            $frontendUrl: '%env(default::FRONTEND_URL)%'
