server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json
               application/javascript text/javascript application/xml+rss;

    # Cache long pour les assets avec hash dans le nom (Vite génère des noms avec hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — toutes les routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sécurité : masquer la version Nginx
    server_tokens off;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    # script-src 'self' : bloque tout script injecté (XSS) — seuls les scripts du bundle Vite sont autorisés
    # style-src 'unsafe-inline' : nécessaire pour les inline styles React (style={{}})
    # connect-src https: : autorise les appels API vers le backend (HTTPS uniquement)
    # img-src data: blob: https: : avatars, previews, icônes SVG
    # media-src blob: : previews audio/vidéo via objectURL
    # object-src 'none' : bloque Flash et plugins obsolètes
    # frame-ancestors 'none' : protège contre le clickjacking
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none';" always;
}